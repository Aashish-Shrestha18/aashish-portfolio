<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500" role="img" aria-labelledby="title desc"><title id="title">SmartInventory system diagram</title><desc id="desc">Java clients send requests through sockets to a threaded Java server, which connects through JDBC to MySQL and creates text reports.</desc><defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#184e63" flood-opacity="0.12"/></filter></defs><rect x="4" y="4" width="742" height="492" rx="28" fill="#eff8f7" stroke="#d4e5e9"/><text x="36" y="55" font-size="17" fill="#147d80" font-family="Arial,sans-serif" font-weight="700">SMARTINVENTORY • SYSTEM OVERVIEW</text><g filter="url(#s)"><rect x="34" y="125" width="207" height="88" rx="17" fill="#ffffff"/><text x="54" y="157" fill="#143047" font-size="19" font-family="Arial,sans-serif" font-weight="700">Java Clients</text><text x="54" y="182" fill="#537182" font-size="14" font-family="Arial,sans-serif">Console • CRUD</text></g><g filter="url(#s)"><rect x="278" y="125" width="208" height="88" rx="17" fill="#ffffff"/><text x="298" y="157" fill="#143047" font-size="19" font-family="Arial,sans-serif" font-weight="700">Java Server</text><text x="298" y="182" fill="#537182" font-size="14" font-family="Arial,sans-serif">Sockets • threads</text></g><g filter="url(#s)"><rect x="526" y="125" width="192" height="88" rx="17" fill="#ffffff"/><text x="546" y="157" fill="#143047" font-size="19" font-family="Arial,sans-serif" font-weight="700">MySQL</text><text x="546" y="182" fill="#537182" font-size="14" font-family="Arial,sans-serif">Inventory table</text></g><path d="M241 169 L278 169" fill="none" stroke="#148b8d" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9"/><path d="M486 169 L526 169" fill="none" stroke="#148b8d" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9"/><rect x="46" y="273" width="658" height="155" rx="19" fill="#ffffff" opacity=".85"/><text x="75" y="315" font-size="16" fill="#1a6174" font-family="Arial,sans-serif" font-weight="700">APPLICATION FEATURES</text><text x="75" y="354" font-size="20" fill="#214051" font-family="Arial,sans-serif" font-weight="700">Create / Read / Update / Delete</text><text x="75" y="384" font-size="17" fill="#507083" font-family="Arial,sans-serif" font-weight="400">Low-stock alerts • Category reports • Inventory value</text><text x="75" y="460" font-size="14" fill="#6c8896" font-family="Arial,sans-serif" font-weight="400">Illustrative architecture · Not an application screenshot</text></svg>